<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kartu Kotoba Minna no Nihongo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f6f2;--surface:#ffffff;--ink:#1d2327;--mute:#5d676d;--line:#dcdad2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181a;--surface:#1e2326;--ink:#ecefef;--mute:#9aa5ab;--line:#343b3f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181a;--surface:#1e2326;--ink:#ecefef;--mute:#9aa5ab;--line:#343b3f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px 10px}
.wrap{max-width:1280px;margin:0 auto}
h1{font:700 20px/1.2 "Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;margin:0 0 10px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px}
input[type=search]{flex:1 1 200px;min-width:0}
button{font:inherit;cursor:pointer}
.tog{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;min-height:38px}
.tog[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{--c:#888;border:1.5px solid var(--c);background:transparent;color:var(--ink);border-radius:999px;padding:4px 11px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip i{font-style:normal;color:var(--mute);font-size:12px}
.chip[aria-pressed=true]{background:var(--c);color:#fff}
.chip[aria-pressed=true] i{color:#fff;opacity:.85}
.chip:focus-visible,.tog:focus-visible,.card:focus-visible,select:focus-visible,input:focus-visible,.more:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
main{padding:16px}
.count{color:var(--mute);margin:0 0 12px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{--c:#888;position:relative;text-align:left;border:1px solid color-mix(in srgb,var(--c) 45%,var(--surface));border-top:5px solid var(--c);border-radius:10px;background:color-mix(in srgb,var(--c) 11%,var(--surface));color:var(--ink);padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-height:150px;content-visibility:auto;contain-intrinsic-size:150px 210px}
.top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute)}
.top b{color:var(--c);font-weight:700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .top b{color:color-mix(in srgb,var(--c) 55%,#fff)}}
:root[data-theme="dark"] .top b{color:color-mix(in srgb,var(--c) 55%,#fff)}
.kana{font:700 24px/1.25 "Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;margin-top:6px;overflow-wrap:anywhere}
.kanji{font:500 17px/1.3 "Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;color:var(--mute);overflow-wrap:anywhere}
.romaji{font-style:italic;color:var(--ink);opacity:.8;overflow-wrap:anywhere}
.arti{margin-top:auto;padding-top:8px;border-top:1px dashed color-mix(in srgb,var(--c) 40%,var(--surface));font-weight:600}
.hide .card:not(.open) .arti{color:transparent;background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--c) 35%,transparent) 0 8px,transparent 8px 12px);background-size:100% 6px;background-repeat:no-repeat;background-position:0 55%;user-select:none}
.more{display:block;margin:20px auto 8px;padding:10px 22px;border-radius:8px;border:1px solid var(--ink);background:var(--surface);color:var(--ink)}
.empty{padding:40px 0;text-align:center;color:var(--mute)}
[hidden]{display:none!important}
#quiz{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.qbar{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;color:var(--mute);font-size:14px}
.qbar label{display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
.qcard{--c:#888;border:1px solid color-mix(in srgb,var(--c) 45%,var(--surface));border-top:6px solid var(--c);border-radius:12px;background:color-mix(in srgb,var(--c) 11%,var(--surface));padding:14px 18px 18px;display:flex;flex-direction:column;gap:6px;min-height:200px}
.qcard .kana{font-size:38px;margin-top:10px}
.qrow{display:flex;gap:8px}
.qin{flex:1;min-width:0;font:inherit;font-size:18px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
.qin[readonly]{opacity:.75}
.qfb{margin:0;font-weight:600;min-height:1.5em}
.ok{color:#1b7f3b}.bad{color:#c62828}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ok{color:#6fdc97}:root:not([data-theme="light"]) .bad{color:#ff9a90}}
:root[data-theme="dark"] .ok{color:#6fdc97}:root[data-theme="dark"] .bad{color:#ff9a90}
.qend{display:flex;flex-direction:column;gap:12px}
.qend h2{font:700 22px/1.2 "Zen Maru Gothic","Yu Gothic",sans-serif;margin:0}
.qacts{display:flex;flex-wrap:wrap;gap:8px}
.qwrong{display:grid;gap:6px;max-height:340px;overflow-y:auto}
.qwrong div{--c:#888;border-left:5px solid var(--c);background:color-mix(in srgb,var(--c) 11%,var(--surface));border-radius:6px;padding:6px 10px}
.qwrong b{font-family:"Zen Maru Gothic","Yu Gothic",sans-serif;font-size:18px}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kana{font-size:20px}}
@media (max-width:640px){
header{position:static;padding:10px 12px 8px}
h1{font-size:18px;margin-bottom:8px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=search],select{grid-column:1/-1;flex:none;font-size:16px;min-height:44px}
.tog{min-height:44px;width:100%}
.chips{flex-wrap:nowrap;overflow-x:auto;margin:10px -12px 0;padding:2px 12px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;min-height:36px}
main{padding:12px}
.grid{gap:8px}
.top{flex-direction:column;gap:0}
.card{min-height:0;padding:8px 10px 10px}
.kana{font-size:20px}
.kanji{font-size:15px}
#quiz{gap:10px}
.qbar{gap:2px 14px;font-size:13px}
.qbar label{min-height:32px}
.qcard{min-height:0;padding:10px 14px 14px}
.qcard .kana{font-size:32px;margin-top:4px}
.qrow{flex-direction:column}
.qin{font-size:16px;min-height:48px}
.qrow .tog{min-height:48px}
.more{width:100%}
}
</style>
</head>
<body>
<header><div class="wrap">
<h1>Kartu Kotoba Minna no Nihongo</h1>
<div class="tools">
<input type="search" id="q" placeholder="Cari kata, kanji, romaji, atau arti" aria-label="Cari kotoba">
<select id="bab" aria-label="Pilih bab"></select>
<button class="tog" id="hide" aria-pressed="false">Mode hafalan</button>
<button class="tog" id="typeBtn" aria-pressed="false">Mode ketik</button>
</div>
<div class="chips" id="chips"></div>
</div></header>
<main><div class="wrap">
<p class="count" id="count" aria-live="polite"></p>
<section id="quiz" hidden aria-label="Latihan mengetik arti">
<div class="qbar"><span id="qprog"></span><span id="qscore" aria-live="polite"></span>
<label><input type="checkbox" id="qshuf" checked> Acak urutan</label>
<label><input type="checkbox" id="qhint" checked> Tampilkan romaji</label></div>
<div class="qcard" id="qcard"></div>
<div class="qrow" id="qrow"><input class="qin" id="qin" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" lang="id" aria-label="Ketik arti kata di atas dalam bahasa Indonesia" placeholder="Ketik artinya, misalnya: saya"><button class="tog" id="qgo">Periksa</button></div>
<p class="qfb" id="qfb" aria-live="polite"></p>
<div class="qend" id="qend" hidden></div>
</section>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" hidden>Tidak ada kotoba yang cocok. Ubah kata kunci atau lepas filter kelompok.</div>
<button class="more" id="more" hidden>Tampilkan lagi</button>
</div></main>

  c.append(top,k);
  if(d[3]){const j=document.createElement('div');j.className='kanji';j.textContent=d[3];c.append(j)}
  const ro=document.createElement('div');ro.className='romaji';ro.textContent=d[6];
  const a=document.createElement('div');a.className='arti';a.textContent=d[4];
  c.append(ro,a);
  c.onclick=()=>c.classList.toggle('open');
  return c;
}
function render(){
  list=D.filter(d=>(!sel.size||sel.has(d[5]))&&(!bab||d[0]==bab)&&(!q||(d[2]+' '+d[3]+' '+d[4]+' '+d[6]).toLowerCase().includes(q)));
  const g=$('grid');g.replaceChildren(...list.slice(0,shown).map(mk));
  $('count').textContent=list.length+' kotoba'+(list.length>shown?' (menampilkan '+shown+')':'');
  $('more').hidden=list.length<=shown;$('empty').hidden=list.length>0;
  syncQuiz();
}
let quizOn=false,Q=[],qi=0,ok=0,bad=0,ans=false,wrongs=[];
const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const qn=s=>s.normalize('NFKC').toLowerCase().replace(/ō/g,'ou').replace(/ū/g,'uu').replace(/ā/g,'aa').replace(/ī/g,'ii').replace(/ē/g,'ei').replace(/[^a-z0-9]/g,'').replace(/oo/g,'ou').replace(/ee/g,'ei').replace(/shi/g,'si').replace(/chi/g,'ti').replace(/tsu/g,'tu').replace(/fu/g,'hu').replace(/ji/g,'zi').replace(/sh/g,'sy').replace(/ch/g,'ty').replace(/j(?=[aou])/g,'zy').replace(/wo/g,'o');
const expd=d=>[qn(d[6]),qn(d[6].replace(/[(（][^)）]*[)）]/g,''))];
function syncQuiz(){$('grid').hidden=quizOn;$('quiz').hidden=!quizOn;if(!quizOn)return;$('more').hidden=true;$('empty').hidden=true;startQuiz()}
function startQuiz(src){
  Q=(src||list).slice();
  if($('qshuf').checked)for(let i=Q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[Q[i],Q[j]]=[Q[j],Q[i]]}
  qi=0;ok=0;bad=0;wrongs=[];
  $('qend').hidden=true;$('qcard').hidden=false;$('qrow').hidden=false;$('qfb').hidden=false;
  showQ();
}
function showQ(){
  if(!Q.length){endQ();return}
  if(qi>=Q.length){endQ();return}
  const d=Q[qi],g=G[d[5]];ans=false;
  const c=$('qcard');c.replaceChildren();c.style.setProperty('--c','#'+g.c);
  const top=E('div','top'),l=E('b',null,g.n);top.append(l,E('span',null,'Bab '+d[0]+' · '+d[1]));
  c.append(top,E('div','kana',d[2]));
  if(d[3])c.append(E('div','kanji',d[3]));
  const a=E('div','romaji',d[6]);a.id='qarti';a.hidden=!$('qhint').checked;c.append(a);
  $('qprog').textContent='Soal '+(qi+1)+' dari '+Q.length;
  $('qscore').textContent='Benar '+ok+' · Salah '+bad;
  const inp=$('qin');inp.value='';inp.readOnly=false;$('qgo').textContent='Periksa';
  $('qfb').className='qfb';$('qfb').textContent='';inp.focus({preventScroll:true});
}
const an=s=>s.normalize('NFKC').toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
const lev=(a,b)=>{const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]};
const BR=/[(（][^)）]*[)）]/g;
const alts=a=>{const s=new Set(),add=x=>{x=an(x);if(x)s.add(x)};add(a);const b=a.replace(BR,' ');add(b);b.split(/[\/,;／]/).forEach(add);return [...s]};
const matchArti=(typed,arti)=>{const A=alts(arti),T=an(typed);if(A.includes(T))return 1;const parts=typed.split(/[\/,;]/).map(an).filter(Boolean);if(parts.length>1&&parts.every(p=>A.includes(p)))return 1;if(T.length>=6&&A.some(x=>x.length>=6&&lev(x,T)<=1))return 2;return 0};
function check(){
  if(ans){qi++;showQ();return}
  const raw=$('qin').value,fb=$('qfb');
  if(!an(raw)){fb.className='qfb';fb.textContent='Ketik dulu artinya.';return}
  const d=Q[qi],res=matchArti(raw,d[4]),right=res>0;ans=true;
  fb.replaceChildren();
  if(right){ok++;fb.className='qfb ok';fb.append('✓ Benar! '+d[4]+(res===2?' (ejaan tepatnya sedikit berbeda)':''))}
  else{bad++;wrongs.push(d);fb.className='qfb bad';fb.append('✗ Salah. Arti yang benar: '+d[4])}
  $('qarti').hidden=!$('qhint').checked&&false;$('qin').readOnly=true;
  $('qscore').textContent='Benar '+ok+' · Salah '+bad;
  $('qgo').textContent=qi+1<Q.length?'Lanjut':'Lihat hasil';
}
function endQ(){
  $('qcard').hidden=true;$('qrow').hidden=true;$('qfb').hidden=true;
  const e=$('qend');e.replaceChildren();e.hidden=false;
  const n=Q.length,pct=n?Math.round(ok/n*100):0;
  $('qprog').textContent='Selesai';
  if(!n){e.append(E('h2',null,'Tidak ada kotoba untuk dilatih'),E('p',null,'Ubah filter bab, kelompok, atau kata kunci.'));return}
  e.append(E('h2',null,'Benar '+ok+' dari '+n+' ('+pct+'%)'));
  const acts=E('div','qacts');
  const b1=E('button','tog','Ulangi dari awal');b1.onclick=()=>startQuiz();acts.append(b1);
  if(wrongs.length){const b2=E('button','tog','Latih yang salah ('+wrongs.length+')');b2.onclick=()=>startQuiz(wrongs);acts.append(b2)}
  const b3=E('button','tog','Kembali ke kartu');b3.onclick=()=>$('typeBtn').click();acts.append(b3);
  e.append(acts);
  if(wrongs.length){
    e.append(E('p',null,'Yang masih salah:'));
    const w=E('div','qwrong');
    wrongs.forEach(d=>{const r=E('div');r.style.setProperty('--c','#'+G[d[5]].c);r.append(E('b',null,d[2]),E('span',null,'  '+d[6]+' = '+d[4]));w.append(r)});
    e.append(w);
  }
}
$('typeBtn').onclick=e=>{quizOn=!quizOn;e.currentTarget.setAttribute('aria-pressed',quizOn);render()};
$('qgo').onclick=check;
$('qin').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();check()}};
$('qshuf').onchange=()=>startQuiz();
$('qhint').onchange=()=>{const a=$('qarti');if(a)a.hidden=!$('qhint').checked};
render();
</script>
</body>
