<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kartu Kotoba Minna no Nihongo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f6f2;--surface:#ffffff;--ink:#1d2327;--mute:#5d676d;--line:#dcdad2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181a;--surface:#1e2326;--ink:#ecefef;--mute:#9aa5ab;--line:#343b3f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181a;--surface:#1e2326;--ink:#ecefef;--mute:#9aa5ab;--line:#343b3f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px 10px}
.wrap{max-width:1280px;margin:0 auto}
h1{font:700 20px/1.2 "Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;margin:0 0 10px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px}
input[type=search]{flex:1 1 200px;min-width:0}
button{font:inherit;cursor:pointer}
.tog{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;min-height:38px}
.tog[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{--c:#888;border:1.5px solid var(--c);background:transparent;color:var(--ink);border-radius:999px;padding:4px 11px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip i{font-style:normal;color:var(--mute);font-size:12px}
.chip[aria-pressed=true]{background:var(--c);color:#fff}
.chip[aria-pressed=true] i{color:#fff;opacity:.85}
.chip:focus-visible,.tog:focus-visible,.card:focus-visible,select:focus-visible,input:focus-visible,.more:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
main{padding:16px}
.count{color:var(--mute);margin:0 0 12px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{--c:#888;position:relative;text-align:left;border:1px solid color-mix(in srgb,var(--c) 45%,var(--surface));border-top:5px solid var(--c);border-radius:10px;background:color-mix(in srgb,var(--c) 11%,var(--surface));color:var(--ink);padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-height:150px;content-visibility:auto;contain-intrinsic-size:150px 210px}
.top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute)}
.top b{color:var(--c);font-weight:700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .top b{color:color-mix(in srgb,var(--c) 55%,#fff)}}
:root[data-theme="dark"] .top b{color:color-mix(in srgb,var(--c) 55%,#fff)}
.kana{font:700 24px/1.25 "Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;margin-top:6px;overflow-wrap:anywhere}
.kanji{font:500 17px/1.3 "Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;color:var(--mute);overflow-wrap:anywhere}
.romaji{font-style:italic;color:var(--ink);opacity:.8;overflow-wrap:anywhere}
.arti{margin-top:auto;padding-top:8px;border-top:1px dashed color-mix(in srgb,var(--c) 40%,var(--surface));font-weight:600}
.hide .card:not(.open) .arti{color:transparent;background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--c) 35%,transparent) 0 8px,transparent 8px 12px);background-size:100% 6px;background-repeat:no-repeat;background-position:0 55%;user-select:none}
.more{display:block;margin:20px auto 8px;padding:10px 22px;border-radius:8px;border:1px solid var(--ink);background:var(--surface);color:var(--ink)}
.empty{padding:40px 0;text-align:center;color:var(--mute)}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kana{font-size:20px}}
</style>
</head>
<body>
<header><div class="wrap">
<h1>Kartu Kotoba Minna no Nihongo</h1>
<div class="tools">
<input type="search" id="q" placeholder="Cari kata, kanji, romaji, atau arti" aria-label="Cari kotoba">
<select id="bab" aria-label="Pilih bab"></select>
<button class="tog" id="hide" aria-pressed="false">Mode hafalan</button>
</div>
<div class="chips" id="chips"></div>
</div></header>
<main><div class="wrap">
<p class="count" id="count" aria-live="polite"></p>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" hidden>Tidak ada kotoba yang cocok. Ubah kata kunci atau lepas filter kelompok.</div>
<button class="more" id="more" hidden>Tampilkan lagi</button>
</div></main>
